[package]
name = "sunmao_unittest_runner"
version = "0.1.0"
edition = "2021"
description = "Audio plugin unit test runner for VST3 and CLAP (optional AU host on macOS)"

[features]
default = []
au = ["dep:au_sys"]

[dependencies]
clap_sys = { path = "../../clap_sys" }
vst3_sys = { path = "../../vst3_sys" }
libloading = "0.8"
libc = "0.2"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
au_sys = { path = "../../au_sys", default-features = false, optional = true }
core-foundation = "0.9"
core-graphics = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[[bin]]
name = "sunmao_unittest_runner"
path = "src/main.rs"
