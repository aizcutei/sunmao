name: Phase 1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The binding layers intentionally retain upstream C/C++ naming and still
  # contain many Rust 2024 unsafe-op warnings. Keep CI output focused on errors.
  RUSTFLAGS: -Awarnings

jobs:
  native-vst3-clap-standalone:
    name: ${{ matrix.name }} VST3 + CLAP + standalone
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            plugin-binary: target/debug/libsunmao_fx_gain.so
            synth-binary: target/debug/libsunmao_syn_sine.so
            gl-binary: target/debug/libsunmao_fx_gain_gui_gl.so
            wgpu-binary: target/debug/libsunmao_fx_gain_gui_wgpu.so
            webview-binary: target/debug/libsunmao_fx_gain_gui_webview.so
            synth-gl-binary: target/debug/libsunmao_syn_sine_gui_gl.so
            synth-wgpu-binary: target/debug/libsunmao_syn_sine_gui_wgpu.so
            synth-webview-binary: target/debug/libsunmao_syn_sine_gui_webview.so
            lpf-binary: target/debug/libsunmao_fx_lpf_gui_gl.so
            daw-binary: target/debug/libsunmao_daw_info_gui.so
            delay-binary: target/debug/libsunmao_fx_tempo_delay.so
            sidechain-binary: target/debug/libsunmao_fx_sidechain_comp.so
            executable-suffix: ""
          - name: macOS native
            os: macos-latest
            plugin-binary: target/debug/libsunmao_fx_gain.dylib
            synth-binary: target/debug/libsunmao_syn_sine.dylib
            gl-binary: target/debug/libsunmao_fx_gain_gui_gl.dylib
            wgpu-binary: target/debug/libsunmao_fx_gain_gui_wgpu.dylib
            webview-binary: target/debug/libsunmao_fx_gain_gui_webview.dylib
            synth-gl-binary: target/debug/libsunmao_syn_sine_gui_gl.dylib
            synth-wgpu-binary: target/debug/libsunmao_syn_sine_gui_wgpu.dylib
            synth-webview-binary: target/debug/libsunmao_syn_sine_gui_webview.dylib
            lpf-binary: target/debug/libsunmao_fx_lpf_gui_gl.dylib
            daw-binary: target/debug/libsunmao_daw_info_gui.dylib
            delay-binary: target/debug/libsunmao_fx_tempo_delay.dylib
            sidechain-binary: target/debug/libsunmao_fx_sidechain_comp.dylib
            executable-suffix: ""
          - name: Windows x86_64
            os: windows-latest
            plugin-binary: target/debug/sunmao_fx_gain.dll
            synth-binary: target/debug/sunmao_syn_sine.dll
            gl-binary: target/debug/sunmao_fx_gain_gui_gl.dll
            wgpu-binary: target/debug/sunmao_fx_gain_gui_wgpu.dll
            webview-binary: target/debug/sunmao_fx_gain_gui_webview.dll
            synth-gl-binary: target/debug/sunmao_syn_sine_gui_gl.dll
            synth-wgpu-binary: target/debug/sunmao_syn_sine_gui_wgpu.dll
            synth-webview-binary: target/debug/sunmao_syn_sine_gui_webview.dll
            lpf-binary: target/debug/sunmao_fx_lpf_gui_gl.dll
            daw-binary: target/debug/sunmao_daw_info_gui.dll
            delay-binary: target/debug/sunmao_fx_tempo_delay.dll
            sidechain-binary: target/debug/sunmao_fx_sidechain_comp.dll
            executable-suffix: .exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl-dev \
            libgl1-mesa-dev \
            libglx-dev \
            libgtk-3-dev \
            libvulkan-dev \
            libvulkan1 \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxmu-dev \
            libxpresent-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxft-dev \
            libxt-dev \
            libxtst-dev \
            libxtst6 \
            libxxf86vm-dev \
            mesa-vulkan-drivers \
            xvfb \
            xauth \
            pkg-config

      - name: Configure Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          runtime_dir="$RUNNER_TEMP/sunmao-xdg"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Validate metadata and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check
          git diff --check

      - name: Test format adapters and host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/phase1-artifacts
          packages=(
            clap_sys
            clap_rs
            vst3_sys
            vst3_rs
            sunmao_core
            sunmao_macros
            sunmao_backend_clap
            sunmao_backend_vst3
            sunmao_packager
            clap_packager
            vst3_packager
            sunmao_gui
            sunmao_gui_wgpu
            sunmao_view_baseview
            sunmao_unittest_runner
            sunmao_fx_gain
            sunmao_syn_sine
          )
          for package in "${packages[@]}"; do
            echo "::group::cargo test -p $package"
            if [ "${{ runner.os }}" = "Linux" ]; then
              # `--` stops xvfb-run from consuming cargo's `-p` flags.
              command=(xvfb-run -a -- cargo test --locked -p "$package")
            else
              command=(cargo test --locked -p "$package")
            fi
            set +e
            "${command[@]}" 2>&1 | tee -a target/phase1-artifacts/format-tests.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              summary="$(tail -n 25 target/phase1-artifacts/format-tests.log | tr '\n' ' ' | cut -c1-1200)"
              echo "::error title=Phase 1 package test failed::cargo test -p $package exited with status $status: $summary"
              exit "$status"
            fi
            echo "::endgroup::"
          done

      - name: Check facade renderer contracts independently
        shell: bash
        run: |
          set -euo pipefail
          for feature in gui-gl gui-wgpu gui-webview; do
            cargo check --locked -p sunmao --no-default-features --features "$feature"
          done

          manifests=(
            examples/sunmao_fx_gain_gui_gl/Cargo.toml
            examples/sunmao_fx_gain_gui_wgpu/Cargo.toml
            examples/sunmao_fx_gain_gui_webview/Cargo.toml
            examples/sunmao_syn_sine_gui_gl/Cargo.toml
            examples/sunmao_syn_sine_gui_wgpu/Cargo.toml
            examples/sunmao_syn_sine_gui_webview/Cargo.toml
            examples/sunmao_fx_lpf_gui_gl/Cargo.toml
            examples/sunmao_daw_info_gui/Cargo.toml
          )
          packages=(
            sunmao_fx_gain_gui_gl
            sunmao_fx_gain_gui_wgpu
            sunmao_fx_gain_gui_webview
            sunmao_syn_sine_gui_gl
            sunmao_syn_sine_gui_wgpu
            sunmao_syn_sine_gui_webview
            sunmao_fx_lpf_gui_gl
            sunmao_daw_info_gui
          )
          for manifest in "${manifests[@]}"; do
            if grep -Eq '^sunmao_(core|macros|gui|view_baseview|backend_(vst3|clap))[[:space:]]*=' "$manifest"; then
              echo "::error file=$manifest::Phase 1 GUI fixtures must depend on the sunmao facade, not internal crates"
              exit 1
            fi
          done
          for package in "${packages[@]}"; do
            cargo check --locked -p "$package"
          done

      - name: Test standalone runtime, facade, and reference examples
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sunmao_runtime
          cargo test --locked -p sunmao --features standalone
          cargo test --locked --features standalone \
            -p sunmao_fx_gain \
            -p sunmao_syn_sine \
            -p sunmao_fx_gain_gui_gl \
            -p sunmao_fx_gain_gui_wgpu \
            -p sunmao_fx_gain_gui_webview \
            -p sunmao_syn_sine_gui_gl \
            -p sunmao_syn_sine_gui_wgpu \
            -p sunmao_syn_sine_gui_webview

      - name: Test Phase 2 acceptance fixtures
        shell: bash
        run: |
          set -euo pipefail
          # The Phase 2 fixtures carry the advanced-contract milestones (M1-M5).
          # Their unit tests and unified VST3+CLAP export path are blocking from
          # M0 on, so contract work cannot regress them unnoticed.
          fixtures=(
            sunmao_fx_tempo_delay
            sunmao_fx_sidechain_comp
            sunmao_syn_poly_expr
            sunmao_state_migration
          )
          for fixture in "${fixtures[@]}"; do
            echo "::group::cargo test -p $fixture"
            set +e
            cargo test --locked -p "$fixture" 2>&1 | tee -a target/phase1-artifacts/phase2-fixture-tests.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              summary="$(tail -n 25 target/phase1-artifacts/phase2-fixture-tests.log | tr '\n' ' ' | cut -c1-1200)"
              echo "::error title=Phase 2 fixture test failed::cargo test -p $fixture exited with status $status: $summary"
              exit "$status"
            fi
            echo "::endgroup::"
          done
          cargo build --locked "${fixtures[@]/#/--package=}"

      - name: Test Phase 3 acceptance fixtures
        shell: bash
        run: |
          set -euo pipefail
          # The Phase 3 fixtures carry the framework/DSP-library milestones
          # (M2-M4): parameter groups + smoothing, the sunmao/dsp components,
          # and oversampling/metering, plus the M1 layout-negotiation fixture.
          # Blocking from M0 on, same shape as the Phase 2 step above.
          fixtures=(
            sunmao_syn_grouped_params
            sunmao_fx_svf
            sunmao_fx_os_dist
            sunmao_fx_meter
            sunmao_fx_layout_gain
          )
          for fixture in "${fixtures[@]}"; do
            echo "::group::cargo test -p $fixture"
            set +e
            cargo test --locked -p "$fixture" 2>&1 | tee -a target/phase1-artifacts/phase3-fixture-tests.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              summary="$(tail -n 25 target/phase1-artifacts/phase3-fixture-tests.log | tr '\n' ' ' | cut -c1-1200)"
              echo "::error title=Phase 3 fixture test failed::cargo test -p $fixture exited with status $status: $summary"
              exit "$status"
            fi
            echo "::endgroup::"
          done
          cargo build --locked "${fixtures[@]/#/--package=}"

      - name: Test macOS system-capture linkage (non-blocking follow-up)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo test --locked -p sunmao_runtime --features system-capture

      - name: Check baseview feature combinations
        run: |
          cargo test --locked -p baseview --all-features
          cargo check --locked -p baseview --all-features --examples

      - name: Test realtime callback allocation matrix
        run: >-
          cargo test --release --locked
          -p clap_rs_fx_gain
          -p clap_rs_syn_sine
          -p vst3_rs_fx_gain
          -p vst3_rs_syn_sine
          -p clap_sys_fx_gain
          -p clap_sys_syn_sine
          -p vst3_sys_fx_gain
          -p vst3_sys_syn_sine
          -p sunmao_backend_clap
          -p sunmao_backend_vst3

      - name: Build cross-platform examples and tools
        run: >-
          cargo build --locked
          -p sunmao_fx_gain
          -p sunmao_syn_sine
          -p sunmao_fx_gain_gui_gl
          -p sunmao_fx_gain_gui_webview
          -p sunmao_fx_gain_gui_wgpu
          -p sunmao_syn_sine_gui_gl
          -p sunmao_syn_sine_gui_wgpu
          -p sunmao_syn_sine_gui_webview
          -p sunmao_fx_lpf_gui_gl
          -p sunmao_daw_info_gui
          -p sunmao_packager

      - name: Build standalone reference applications
        run: >-
          cargo build --locked --bins --features standalone
          -p sunmao_fx_gain
          -p sunmao_syn_sine
          -p sunmao_fx_gain_gui_gl
          -p sunmao_fx_gain_gui_webview
          -p sunmao_fx_gain_gui_wgpu
          -p sunmao_syn_sine_gui_gl
          -p sunmao_syn_sine_gui_wgpu
          -p sunmao_syn_sine_gui_webview

      - name: Build test runner separately
        run: cargo build --locked -p sunmao_unittest_runner

      - name: Assert default macOS binaries are AU-free
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for binary in \
            target/debug/libsunmao_fx_gain.dylib \
            target/debug/libsunmao_syn_sine.dylib \
            target/debug/libsunmao_fx_gain_gui_gl.dylib \
            target/debug/libsunmao_fx_gain_gui_wgpu.dylib \
            target/debug/libsunmao_fx_gain_gui_webview.dylib \
            target/debug/libsunmao_syn_sine_gui_gl.dylib \
            target/debug/libsunmao_syn_sine_gui_wgpu.dylib \
            target/debug/libsunmao_syn_sine_gui_webview.dylib \
            target/debug/libsunmao_fx_lpf_gui_gl.dylib \
            target/debug/libsunmao_daw_info_gui.dylib; do
            test -f "$binary"
            symbols="$(nm "$binary")"
            if grep -Eq 'RustAUFactory|au_component_factory|SunmaoAUCocoa' <<<"$symbols"; then
              echo "AU symbols leaked into default Phase-1 binary: $binary" >&2
              exit 1
            fi
          done
          runner=target/debug/sunmao_unittest_runner
          test -f "$runner"
          symbols="$(nm "$runner")"
          if grep -Eq 'RustAUFactory|au_component_factory|SunmaoAUCocoa' <<<"$symbols"; then
            echo "Plugin-only AU symbols leaked into the test runner: $runner" >&2
            exit 1
          fi

      - name: Package and exercise VST3 + CLAP + standalone
        shell: bash
        run: |
          set -euo pipefail
          packager="target/debug/sunmao_packager${{ matrix.executable-suffix }}"
          runner="target/debug/sunmao_unittest_runner${{ matrix.executable-suffix }}"
          output="target/phase1-artifacts/SunMaoGain"
          synth_output="target/phase1-artifacts/SunMaoSine"
          delay_output="target/phase1-artifacts/SunMaoTempoDelay"
          sidechain_output="target/phase1-artifacts/SunMaoSidechainComp"
          standalone_dir="target/phase1-artifacts/standalone"
          gain_standalone="target/debug/sunmao_fx_gain_standalone${{ matrix.executable-suffix }}"
          synth_standalone="target/debug/sunmao_syn_sine_standalone${{ matrix.executable-suffix }}"
          gain_standalone_output="$standalone_dir/SunMaoGain"
          synth_standalone_output="$standalone_dir/SunMaoSine"
          mkdir -p "$standalone_dir"

          # The packager names the .app's inner executable after the --out
          # path's stem (module_stem), not the display name.
          packaged_standalone() {
            local output_base="$1"
            case "${{ runner.os }}" in
              macOS) printf '%s.app/Contents/MacOS/%s\n' "$output_base" "$(basename "$output_base")" ;;
              Windows) printf '%s.exe\n' "$output_base" ;;
              Linux) printf '%s\n' "$output_base" ;;
              *) echo "unsupported runner OS: ${{ runner.os }}" >&2; return 1 ;;
            esac
          }

          "$packager" vst3 \
            --binary "${{ matrix.plugin-binary }}" \
            --out "$output" \
            --name "SunMao Gain" \
            --bundle-id com.sunmao.fx.gain \
            --version 1.0.0
          "$packager" clap \
            --binary "${{ matrix.plugin-binary }}" \
            --out "$output" \
            --name "SunMao Gain" \
            --bundle-id com.sunmao.fx.gain \
            --version 1.0.0
          "$packager" vst3 \
            --binary "${{ matrix.synth-binary }}" \
            --out "$synth_output" \
            --name "SunMao Sine Synth" \
            --bundle-id com.sunmao.synth.sine \
            --version 1.0.0
          "$packager" clap \
            --binary "${{ matrix.synth-binary }}" \
            --out "$synth_output" \
            --name "SunMao Sine Synth" \
            --bundle-id com.sunmao.synth.sine \
            --version 1.0.0
          # Phase 2 contract fixtures. The Phase 1 gain/sine plugins report zero
          # latency, no tail and a single input bus, so the runner's host-side
          # latency/tail, bus-topology and sidechain-routing assertions would
          # only ever take their skip paths without these two.
          for format in vst3 clap; do
            "$packager" "$format" \
              --binary "${{ matrix.delay-binary }}" \
              --out "$delay_output" \
              --name "SunMao Tempo Delay" \
              --bundle-id com.sunmao.fx.tempo-delay \
              --version 1.0.0
            "$packager" "$format" \
              --binary "${{ matrix.sidechain-binary }}" \
              --out "$sidechain_output" \
              --name "SunMao Sidechain Comp" \
              --bundle-id com.sunmao.fx.sidechain-comp \
              --version 1.0.0
          done
          "$packager" standalone \
            --binary "$gain_standalone" \
            --out "$gain_standalone_output" \
            --name "SunMao Gain" \
            --bundle-id com.sunmao.fx.gain \
            --version 1.0.0
          "$packager" standalone \
            --binary "$synth_standalone" \
            --out "$synth_standalone_output" \
            --name "SunMao Sine Synth" \
            --bundle-id com.sunmao.synth.sine \
            --version 1.0.0

          packaged_gain="$(packaged_standalone "$gain_standalone_output")"
          packaged_synth="$(packaged_standalone "$synth_standalone_output")"

          {
            echo "commit=${GITHUB_SHA:-unknown}"
            echo "ref=${GITHUB_REF:-unknown}"
            echo "os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "packager=$packager"
            echo
            echo "Packaged gain/sine VST3+CLAP bundles and standalone applications:"
            ls -la "$output.vst3" "$output.clap" "$synth_output.vst3" "$synth_output.clap"
            ls -la "$packaged_gain" "$packaged_synth"
          } > target/phase1-artifacts/packager-validation.txt

          "$runner" test "$output.vst3" 2>&1 | tee "$output.vst3.test.log"
          "$runner" test "$output.clap" 2>&1 | tee "$output.clap.test.log"
          "$runner" test "$synth_output.vst3" 2>&1 | tee "$synth_output.vst3.test.log"
          "$runner" test "$synth_output.clap" 2>&1 | tee "$synth_output.clap.test.log"
          "$runner" test "$delay_output.vst3" 2>&1 | tee "$delay_output.vst3.test.log"
          "$runner" test "$delay_output.clap" 2>&1 | tee "$delay_output.clap.test.log"
          "$runner" test "$sidechain_output.vst3" 2>&1 | tee "$sidechain_output.vst3.test.log"
          "$runner" test "$sidechain_output.clap" 2>&1 | tee "$sidechain_output.clap.test.log"
          "$gain_standalone" --smoke 2>&1 | tee "$gain_standalone_output.raw.smoke.log"
          "$synth_standalone" --smoke 2>&1 | tee "$synth_standalone_output.raw.smoke.log"
          "$packaged_gain" --smoke 2>&1 | tee "$gain_standalone_output.packaged.smoke.log"
          "$packaged_synth" --smoke 2>&1 | tee "$synth_standalone_output.packaged.smoke.log"

          if "$runner" test "target/phase1-artifacts/missing.clap" 2>&1 | tee "target/phase1-artifacts/missing.clap.test.log"; then
            echo "runner unexpectedly accepted a missing plugin" >&2
            exit 1
          fi

      - name: Package and exercise native GUI backends
        shell: bash
        env:
          SUNMAO_GUI_RENDER_MS: "1500"
          SUNMAO_GUI_PIXEL_TIMEOUT_MS: "10000"
          SUNMAO_UIA_HELPER_TIMEOUT_MS: "20000"
          SUNMAO_GUI_PIXEL_PROBE: "1"
        run: |
          set -euo pipefail
          packager="target/debug/sunmao_packager${{ matrix.executable-suffix }}"
          runner="target/debug/sunmao_unittest_runner${{ matrix.executable-suffix }}"
          mkdir -p target/phase1-artifacts
          echo "GUI/plugin artifacts in target/debug:"
          ls -la target/debug | sed -n '1,80p' || true
          for binary in \
            "${{ matrix.gl-binary }}" \
            "${{ matrix.wgpu-binary }}" \
            "${{ matrix.webview-binary }}" \
            "${{ matrix.synth-gl-binary }}" \
            "${{ matrix.synth-wgpu-binary }}" \
            "${{ matrix.synth-webview-binary }}" \
            "${{ matrix.lpf-binary }}" \
            "${{ matrix.daw-binary }}"; do
            if [ ! -e "$binary" ]; then
              echo "GUI binary missing: $binary" >&2
              ls -la "$(dirname "$binary")" || true
              exit 1
            fi
            ls -la "$binary"
          done
          if [ "${{ runner.os }}" = "Linux" ]; then
            # A single GUI lifecycle normally finishes in seconds. Kill hung
            # invocations after 3 minutes so the ::error log tail shows the
            # last completed phase instead of stalling the job for 75 minutes.
            gui_runner=(timeout --signal=TERM --kill-after=15 180 xvfb-run -a -- env GDK_BACKEND=x11 WGPU_BACKEND=gl LIBGL_ALWAYS_SOFTWARE=1 "$runner")
            standalone_gui_prefix=(timeout --signal=TERM --kill-after=15 180 xvfb-run -a -- env GDK_BACKEND=x11 WGPU_BACKEND=gl LIBGL_ALWAYS_SOFTWARE=1)
          else
            gui_runner=("$runner")
            standalone_gui_prefix=()
          fi

          run_gui_test() {
            local log="$1"
            shift
            set +e
            "${gui_runner[@]}" "$@" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              if [ "${{ runner.os }}" = "macOS" ]; then sleep 1; fi
              return 0
            fi
            local summary
            summary="$(tail -n 25 "$log" | tr '\n' ' ' | cut -c1-1200)"
            echo "::error title=Phase 1 GUI test failed::$summary"
            if [ "${{ runner.os }}" != "macOS" ]; then
              return "$status"
            fi
            echo "macOS GUI host failed; retrying once after WindowServer cooldown" >&2
            sleep 5
            set +e
            "${gui_runner[@]}" "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              sleep 1
              return 0
            fi
            summary="$(tail -n 25 "$log" | tr '\n' ' ' | cut -c1-1200)"
            echo "::error title=Phase 1 GUI retry failed::$summary"
            return "$status"
          }

          run_standalone_gui_test() {
            local log="$1" executable="$2"
            set +e
            if [ "${{ runner.os }}" = "Linux" ]; then
              "${standalone_gui_prefix[@]}" "$executable" --gui-smoke 2>&1 | tee "$log"
            else
              "$executable" --gui-smoke 2>&1 | tee "$log"
            fi
            local status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              if [ "${{ runner.os }}" = "macOS" ]; then sleep 1; fi
              return 0
            fi
            local summary
            summary="$(tail -n 25 "$log" | tr '\n' ' ' | cut -c1-1200)"
            echo "::error title=Phase 1 standalone GUI test failed::$summary"
            if [ "${{ runner.os }}" != "macOS" ]; then
              return "$status"
            fi
            echo "macOS standalone GUI failed; retrying once after WindowServer cooldown" >&2
            sleep 5
            set +e
            "$executable" --gui-smoke 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            return "$status"
          }

          # Same contract as above: the inner executable is named after the
          # --out path's stem, not the display name.
          packaged_standalone() {
            local output_base="$1"
            case "${{ runner.os }}" in
              macOS) printf '%s.app/Contents/MacOS/%s\n' "$output_base" "$(basename "$output_base")" ;;
              Windows) printf '%s.exe\n' "$output_base" ;;
              Linux) printf '%s\n' "$output_base" ;;
              *) echo "unsupported runner OS: ${{ runner.os }}" >&2; return 1 ;;
            esac
          }

          package_and_test_standalone_gui() {
            local output_name="$1" binary_name="$2" display_name="$3" bundle_id="$4"
            local binary="target/debug/${binary_name}${{ matrix.executable-suffix }}"
            local output="target/phase1-artifacts/standalone/${output_name}"
            local packaged
            test -f "$binary"
            mkdir -p target/phase1-artifacts/standalone
            run_standalone_gui_test "$output.raw.gui-smoke.log" "$binary"
            "$packager" standalone \
              --binary "$binary" \
              --out "$output" \
              --name "$display_name" \
              --bundle-id "$bundle_id" \
              --version 1.0.0
            packaged="$(packaged_standalone "$output")"
            test -f "$packaged"
            run_standalone_gui_test "$output.packaged.gui-smoke.log" "$packaged"
          }

          package_and_test_gui() {
            local output_name="$1" binary="$2" display_name="$3" bundle_id="$4"
            local drag_from="$5" drag_to="$6"
            local output="target/phase1-artifacts/${output_name}"
            "$packager" vst3 \
              --binary "$binary" \
              --out "$output" \
              --name "$display_name" \
              --bundle-id "$bundle_id" \
              --version 1.0.0
            "$packager" clap \
              --binary "$binary" \
              --out "$output" \
              --name "$display_name" \
              --bundle-id "$bundle_id" \
              --version 1.0.0
            "$runner" test "$output.vst3" 2>&1 | tee "$output.vst3.test.log"
            "$runner" test "$output.clap" 2>&1 | tee "$output.clap.test.log"
            run_gui_test "$output.vst3.gui-test.log" gui-test --auto-close --verify-pixels --verify-input \
              --drag-from "$drag_from" --drag-to "$drag_to" "$output.vst3"
            run_gui_test "$output.clap.gui-test.log" gui-test --auto-close --verify-pixels --verify-input \
              --drag-from "$drag_from" --drag-to "$drag_to" "$output.clap"
          }

          package_and_test_gui SunMaoGainGL "${{ matrix.gl-binary }}" \
            "SunMao Gain GL" com.sunmao.fx.gain.gl 64,110 456,110
          package_and_test_gui SunMaoGainWGPU "${{ matrix.wgpu-binary }}" \
            "SunMao Gain WGPU" com.sunmao.fx.gain.wgpu 64,110 456,110
          package_and_test_gui SunMaoGainWebView "${{ matrix.webview-binary }}" \
            "SunMao Gain WebView" com.sunmao.fx.gain.webview 120,150 400,150
          package_and_test_gui SunMaoSineGL "${{ matrix.synth-gl-binary }}" \
            "SunMao Sine Synth GL" com.sunmao.synth.sine.gl 64,110 456,110
          package_and_test_gui SunMaoSineWGPU "${{ matrix.synth-wgpu-binary }}" \
            "SunMao Sine Synth WGPU" com.sunmao.synth.sine.wgpu 64,110 456,110
          package_and_test_gui SunMaoSineWebView "${{ matrix.synth-webview-binary }}" \
            "SunMao Sine Synth WebView" com.sunmao.synth.sine.webview 120,138 400,138

          package_and_test_standalone_gui SunMaoGainGL sunmao_fx_gain_gui_gl_standalone \
            "SunMao Gain GL" com.sunmao.fx.gain.gl
          package_and_test_standalone_gui SunMaoGainWGPU sunmao_fx_gain_gui_wgpu_standalone \
            "SunMao Gain WGPU" com.sunmao.fx.gain.wgpu
          package_and_test_standalone_gui SunMaoGainWebView sunmao_fx_gain_gui_webview_standalone \
            "SunMao Gain WebView" com.sunmao.fx.gain.webview
          package_and_test_standalone_gui SunMaoSineGL sunmao_syn_sine_gui_gl_standalone \
            "SunMao Sine Synth GL" com.sunmao.synth.sine.gl
          package_and_test_standalone_gui SunMaoSineWGPU sunmao_syn_sine_gui_wgpu_standalone \
            "SunMao Sine Synth WGPU" com.sunmao.synth.sine.wgpu
          package_and_test_standalone_gui SunMaoSineWebView sunmao_syn_sine_gui_webview_standalone \
            "SunMao Sine Synth WebView" com.sunmao.synth.sine.webview

          package_and_test_gui_lifecycle() {
            local backend="$1" binary="$2" display_name="$3" bundle_suffix="$4"
            local output="target/phase1-artifacts/SunMao${backend}"
            "$packager" vst3 \
              --binary "$binary" \
              --out "$output" \
              --name "$display_name" \
              --bundle-id "com.sunmao.$bundle_suffix" \
              --version 1.0.0
            "$packager" clap \
              --binary "$binary" \
              --out "$output" \
              --name "$display_name" \
              --bundle-id "com.sunmao.$bundle_suffix" \
              --version 1.0.0
            "$runner" test "$output.vst3" 2>&1 | tee "$output.vst3.test.log"
            "$runner" test "$output.clap" 2>&1 | tee "$output.clap.test.log"
            run_gui_test "$output.vst3.gui-test.log" gui-test --auto-close --verify-pixels "$output.vst3"
            run_gui_test "$output.clap.gui-test.log" gui-test --auto-close --verify-pixels "$output.clap"
          }

          package_and_test_gui_lifecycle LPFGL "${{ matrix.lpf-binary }}" "SunMao LPF GL" fx.lpf.gl
          package_and_test_gui_lifecycle DAWInfoGUI "${{ matrix.daw-binary }}" "SunMao DAW Info GUI" daw.info.gui

      - name: Exercise repository packaging helper
        shell: bash
        timeout-minutes: 20
        run: tools/package_examples.sh --debug --test

      - name: Upload packaged Phase 1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase1-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/phase1-artifacts/SunMaoGain.vst3
            target/phase1-artifacts/SunMaoGain.clap
            target/phase1-artifacts/SunMaoSine.vst3
            target/phase1-artifacts/SunMaoSine.clap
            target/phase1-artifacts/SunMaoGainGL.vst3
            target/phase1-artifacts/SunMaoGainGL.clap
            target/phase1-artifacts/SunMaoGainWGPU.vst3
            target/phase1-artifacts/SunMaoGainWGPU.clap
            target/phase1-artifacts/SunMaoGainWebView.vst3
            target/phase1-artifacts/SunMaoGainWebView.clap
            target/phase1-artifacts/SunMaoSineGL.vst3
            target/phase1-artifacts/SunMaoSineGL.clap
            target/phase1-artifacts/SunMaoSineWGPU.vst3
            target/phase1-artifacts/SunMaoSineWGPU.clap
            target/phase1-artifacts/SunMaoSineWebView.vst3
            target/phase1-artifacts/SunMaoSineWebView.clap
            target/phase1-artifacts/SunMaoLPFGL.vst3
            target/phase1-artifacts/SunMaoLPFGL.clap
            target/phase1-artifacts/SunMaoDAWInfoGUI.vst3
            target/phase1-artifacts/SunMaoDAWInfoGUI.clap
            target/phase1-artifacts/standalone
            target/phase1-artifacts/format-tests.log
            target/phase1-artifacts/*.test.log
            target/phase1-artifacts/*.gui-test.log
            target/phase1-artifacts/*.validation.txt
          if-no-files-found: error

      - name: Upload Phase 1 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-failure-${{ runner.os }}-${{ runner.arch }}
          path: target/phase1-artifacts
          if-no-files-found: ignore
