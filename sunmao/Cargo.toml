[package]
name = "sunmao"
version = "0.1.0"
edition = "2021"
description = "Audio plugin framework for Rust"
license = "MIT OR Apache-2.0"
authors = ["aizcutei"]
homepage = "https://aizcutei.github.io/sunmao"
repository = "https://github.com/aizcutei/sunmao"

[dependencies]
sunmao_core = { path = "core" }
sunmao_dsp = { path = "dsp" }
sunmao_macros = { path = "macros" }
sunmao_backend_clap = { path = "backend_clap" }
sunmao_backend_vst3 = { path = "backend_vst3" }
sunmao_runtime = { path = "runtime", optional = true }
sunmao_gui = { path = "gui", default-features = false, optional = true }
sunmao_view_baseview = { path = "view_baseview", default-features = false, optional = true }

[features]
default = []
standalone = ["dep:sunmao_runtime"]
# `text` brings the TTF rasterizer with it: an editor that can draw is
# expected to be able to measure and draw text.
gui = ["dep:sunmao_gui", "sunmao_gui/text"]
gui-gl = [
    "gui",
    "dep:sunmao_view_baseview",
    "sunmao_view_baseview/gl",
    "sunmao_view_baseview/wgpu",
]
gui-wgpu = [
    "gui",
    "dep:sunmao_view_baseview",
    "sunmao_view_baseview/wgpu",
]
gui-webview = [
    "gui",
    "sunmao_gui/webview",
    "dep:sunmao_view_baseview",
    "sunmao_view_baseview/webview",
]
# Publish the editor's accessibility tree through AccessKit, which owns the
# native UI Automation / NSAccessibility / AT-SPI bridges. Off by default: it
# is a real dependency surface and the tree is useful without it.
accessibility = ["gui", "sunmao_gui/accessibility", "sunmao_view_baseview?/accessibility"]

[dev-dependencies]
proptest = "1.11.0"
