[package]
name = "baseview"
version = "0.1.0"
authors = [
    "William Light <git@wrl.lhiaudio.com>",
    "Charles Saracco <crsaracco@gmail.com>",
    "Mirko Covizzi <mrkcvzz@gmail.com>",
    "Micah Johnston <micah@glowcoil.com>",
    "Billy Messenger <billydm@protonmail.com>",
    "Anton Lazarev <https://antonok.com>",
    "Joakim Frostegård <joakim.frostegard@gmail.com>",
    "Robbert van der Helm <mail@robbertvanderhelm.nl>",
]
edition = "2018"
license = "MIT OR Apache-2.0"

[features]
default = []
opengl = ["uuid", "x11/glx"]
metal = []
webview = ["dep:wry", "dep:gtk", "dep:gdk"]
# Publish an accessibility tree through AccessKit's native adapters. Off by
# default: the Linux adapter alone pulls a D-Bus stack, and a window that does
# not describe itself should not pay for one.
accessibility = ["dep:accesskit", "dep:accesskit_windows", "dep:accesskit_macos", "dep:accesskit_unix"]
# Native Wayland. Off by default and Linux-only: the X11 backend already works
# on Wayland desktops through XWayland, so this is an improvement (no X server,
# proper per-output scaling) rather than a prerequisite.
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-backend", "dep:wayland-sys", "dep:khronos-egl"]

[dependencies]
keyboard-types = { version = "0.6.1", default-features = false }
raw-window-handle = "0.6.2"
accesskit = { version = "0.25", optional = true }
wry = { version = "=0.53.3", default-features = false, features = ["os-webview", "x11"], optional = true }

[target.'cfg(target_os="linux")'.dependencies]
x11rb = { version = "0.13.0", features = ["cursor", "resource_manager", "allow-unsafe-code"] }
x11 = { version = "2.21", features = ["xlib", "xlib_xcb"] }
nix = "0.22.0"
gtk = { version = "0.18", features = ["unsafe-assume-initialized"], optional = true }
gdk = { version = "0.18", features = ["unsafe-assume-initialized"], optional = true }
accesskit_unix = { version = "0.23", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"], optional = true }
wayland-sys = { version = "0.31", features = ["egl", "dlopen"], optional = true }
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }

[target.'cfg(target_os="windows")'.dependencies]
winapi = { version = "0.3.8", features = ["libloaderapi", "winuser", "windef", "minwindef", "guiddef", "combaseapi", "wingdi", "errhandlingapi", "ole2", "oleidl", "shellapi", "winerror"] }
uuid = { version = "0.8", features = ["v4"], optional = true }
accesskit_windows = { version = "0.35", optional = true }

[target.'cfg(target_os="macos")'.dependencies]
cocoa = "0.24.0"
core-foundation = "0.9.1"
objc = "0.2.7"
uuid = { version = "0.8", features = ["v4"] }
accesskit_macos = { version = "0.27", optional = true }

[dev-dependencies]
glow = "0.16"
rtrb = "0.2"
softbuffer = "0.4.8"

# Note: workspace definition removed to allow integration with parent workspace

[lints.clippy]
missing-safety-doc = "allow"

[[example]]
name = "open_window"
test = true
doctest = true

[[example]]
name = "open_parented"
test = true
doctest = true
