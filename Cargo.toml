[workspace]
# `fuzz` is intentionally outside the workspace: the blocking gate must never
# build or run it (unbounded fuzzing is local-only and non-blocking).
exclude = ["fuzz"]
members = [
    "au_sys",
    "au_cocoa_stubs",
    "au_rs",
    "clap_sys",
    "clap_rs",
    "vst3_sys",
    "vst3_rs",
    "examples/au_sys_syn_sine",
    "examples/au_sys_fx_gain",
    "examples/au_sys_fx_gain_gui_gl",
    "examples/au_rs_syn_sine",
    "examples/au_rs_fx_gain",
    "examples/au_rs_fx_gain_gui_opengl",
    "examples/au_rs_fx_gain_gui_wgpu",
    "examples/au_rs_fx_gain_gui_webview",
    "examples/clap_sys_fx_gain",
    "examples/clap_sys_fx_gain_gui_baseview",
    "examples/clap_sys_syn_sine",
    "examples/clap_rs_fx_gain",
    "examples/clap_rs_fx_gain_gui_baseview",
    "examples/clap_rs_syn_sine",
    "examples/vst3_sys_fx_gain",
    "examples/vst3_sys_fx_gain_gui_baseview",
    "examples/vst3_sys_syn_sine",
    "examples/vst3_rs_fx_gain",
    "examples/vst3_rs_syn_sine",
    "examples/vst3_rs_fx_gain_gui_baseview",
    "tools/clap_packager",
    "tools/au_packager",
    "tools/vst3_packager",
    "tools/sunmao_packager",
    "tools/sunmao_unittest_runner",
    "baseview",
    "sunmao",
    "sunmao/core",
    "sunmao/dsp",
    "sunmao/macros",
    "sunmao/runtime",
    "sunmao/backend_vst3",
    "sunmao/backend_clap",
    "sunmao/backend_au",
    "sunmao/gui",
    "sunmao/gui_gl",
    "sunmao/gui_wgpu",
    "sunmao/gui_webview",
    "sunmao/view_baseview",
    "examples/sunmao_fx_gain",
    "examples/sunmao_syn_sine",
    "examples/sunmao_syn_sine_gui_gl",
    "examples/sunmao_syn_sine_gui_wgpu",
    "examples/sunmao_syn_sine_gui_webview",
    "examples/sunmao_gui_gl_test",
    "examples/sunmao_fx_gain_gui_gl",
    "examples/sunmao_fx_lpf_gui_gl",
    "examples/sunmao_fx_gain_gui_wgpu",
    "examples/sunmao_fx_gain_gui_webview",
    "examples/sunmao_daw_info_gui",
    "examples/sunmao_fx_tempo_delay",
    "examples/sunmao_fx_sidechain_comp",
    "examples/sunmao_syn_poly_expr",
    "examples/sunmao_state_migration",
    "examples/sunmao_syn_grouped_params",
    "examples/sunmao_fx_svf",
    "examples/sunmao_fx_layout_gain",
    "examples/sunmao_template_effect",
    "examples/sunmao_template_instrument",
    "examples/sunmao_fx_os_dist",
    "examples/sunmao_fx_meter",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# NOTE: rustc 1.96 + the current macOS `ld` can emit a "mis-aligned LINKEDIT string pool"
# Mach-O when release-stripping cdylibs that pull in a lot of code (observed on the wgpu
# GUI plugins). The resulting dylib fails to dlopen. Keeping symbols (`strip = false`) avoids
# it. Revisit once the toolchain is upgraded. See debug/phase1_assessment.md.
[profile.release]
strip = false
