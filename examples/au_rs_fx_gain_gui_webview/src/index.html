<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            user-select: none;
        }

        .container {
            width: 90%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 14px;
            font-weight: 500;
            color: #8892b0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value-display {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(90deg, #64ffda, #7f5af0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .slider-container {
            width: 100%;
            padding: 8px 0;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #64ffda, #7f5af0);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(100, 255, 218, 0.4);
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(0.95);
        }

        .labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #5f6c8c;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">Gain</div>
        <div class="value-display" id="value">1.00</div>
        <div class="slider-container">
            <input type="range" id="slider" min="0" max="200" value="100">
        </div>
        <div class="labels">
            <span>0.0</span>
            <span>1.0</span>
            <span>2.0</span>
        </div>
    </div>

    <script>
        const slider = document.getElementById('slider');
        const valueDisplay = document.getElementById('value');

        function updateValue(val) {
            const gain = val / 100;
            valueDisplay.textContent = gain.toFixed(2);
        }

        slider.addEventListener('input', function () {
            const gain = this.value / 100;
            updateValue(this.value);
            // Send to Rust via webkit message handler
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gain) {
                window.webkit.messageHandlers.gain.postMessage(gain.toString());
            }
        });

        // Function to be called from Rust to update slider
        function setGain(gain) {
            const val = Math.round(gain * 100);
            slider.value = val;
            updateValue(val);
        }
    </script>
</body>

</html>
