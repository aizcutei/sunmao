[package]
name = "sunmao_syn_sine_gui_wgpu"
version = "0.1.0"
edition = "2021"
description = "Sine synth example with a WGPU GUI using SunMao"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sunmao_syn_sine_gui_wgpu_standalone"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[features]
default = []
standalone = ["sunmao/standalone"]

[dependencies]
sunmao = { path = "../../sunmao", features = ["gui-wgpu"] }
