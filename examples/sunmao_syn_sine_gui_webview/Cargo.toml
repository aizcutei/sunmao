[package]
name = "sunmao_syn_sine_gui_webview"
version = "0.1.0"
edition = "2021"
description = "Sine synth example with a WebView GUI using SunMao"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
sunmao = { path = "../../sunmao" }
sunmao_core = { path = "../../sunmao/core" }
sunmao_gui = { path = "../../sunmao/gui", default-features = false }
sunmao_macros = { path = "../../sunmao/macros" }
sunmao_view_baseview = { path = "../../sunmao/view_baseview", default-features = false, features = ["webview"] }
