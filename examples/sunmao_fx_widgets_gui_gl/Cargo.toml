[package]
name = "sunmao_fx_widgets_gui_gl"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sunmao_fx_widgets_gui_gl_standalone"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[features]
default = []
standalone = ["sunmao/standalone"]
# Publish this editor's accessibility tree to the OS. Off by default so the
# packaged fixture matches what a plugin ships without opting in.
accessibility = ["sunmao/accessibility"]

[dependencies]
sunmao = { path = "../../sunmao", features = ["gui-gl"] }

# Only for the UI Automation round-trip test: it queries the editor with the
# same API a screen reader uses. Same crate and version the runner already
# depends on, so it costs no extra lockfile entry.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
